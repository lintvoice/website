[project]
name = "lintvoice-website"
version = "0.0.0"
description = "The lintvoice.com website: a static site built from templates, texts and the invoice-examples generator"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "invoice-examples==0.1.0",  # the gallery is generated at this exact version
    "markdown-it-py>=4.2,<4.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["dist"]

[tool.ruff.lint]
# Curated set: errors, likely bugs, security, modern syntax, simplifications, Ruff's own rules.
select = ["E", "F", "W", "B", "S", "UP", "SIM", "RUF", "C4", "PERF"]
# Long lines are the formatter's call; ×, ✓, « » and other non-ASCII characters are intended; PERF401 flags
# loops whose side effects (files written, rules seen) a comprehension would hide.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S310"]  # asserts and subprocesses are what tests are made of
