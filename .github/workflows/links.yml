name: links
# External links rot: a weekly check rather than a gate on every push.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: website, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: lintvoice/invoice-examples, path: invoice-examples, persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run python build.py
        working-directory: website
      - name: Links
        env:
          GITHUB_TOKEN: ${{ github.token }}  # lychee's GitHub requests, without the anonymous rate limit
        working-directory: website
        run: docker run --rm -e GITHUB_TOKEN -v "$PWD:/w" -w /w lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d --config lychee.toml --root-dir /w/dist README.md 'dist/**/*.html'  # 0.24.2
