name: ci
on: [push, pull_request]
# Actions are pinned to commit SHAs (a tag can be moved); the comment gives the version.

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  checks:
    # Lint, format, workflow security, known vulnerabilities (locked and lowest allowed versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: website, persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff@0.17.2 check .
      - run: uvx ruff@0.17.2 format --check .
      - run: uvx zizmor@1.31.1 --offline .github/workflows/
      - name: Wording (Vale) - we help check, we never certify
        run: docker run --rm -v "$PWD:/docs" -w /docs jdkato/vale@sha256:f5a09410093936d4919d868120786da9789e2652ac321c66a895403eca020ae4 README.md  # v3.24.0
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes --all-groups -o "$RUNNER_TEMP/locked.txt"
          uvx pip-audit@2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/locked.txt"
      - name: Known vulnerabilities in the locked npm packages (the in-browser check's tools)
        run: npm audit --package-lock-only

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: website, persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run pytest -q
      - run: uv run python build.py

  parity:
    # The check page against the lintvoice command-line tool, file by file, in each browser engine (tools/parity.py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: website, persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --frozen python build.py
      - run: uv run --frozen --group parity playwright install --with-deps "$BROWSER"
      - run: uv run --frozen --group parity python tools/parity.py "$BROWSER"
