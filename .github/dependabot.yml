version: 2
# Weekly version updates after a 7-day cooldown (never adopt a same-day release).
# Security updates are not delayed by the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  # pdf.js, xmllint-wasm and xslt3: the in-browser check's tools. Their versions are also written in checkassets.py's
  # notices: update them with the package.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
