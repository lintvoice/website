[home]
title = "lintvoice: check e-invoices against the official rules, offline"
description = "Open-source validator for CII, UBL and Factur-X e-invoices. It runs the official EN 16931, Factur-X and French BR-FR rules, offline."
h1 = "Check e-invoices against the official rules, offline"
brief = "lintvoice is an open-source command-line validator for CII, UBL and Factur-X invoices. It runs the official EN 16931, Factur-X and French BR-FR rules offline: your invoices are never sent anywhere."
glance_title = "At a glance"
glance = [
    ["Licence", "[MIT](https://github.com/lintvoice/lintvoice/blob/main/LICENSE)"],
    ["Python", "3.10 or later"],
    ["Reads", "CII, UBL, Factur-X and ZUGFeRD PDF"],
    ["Network", "only to install the rules, once"],
]
exit_title = "Exit codes"
exit_codes = [
    ["0", "No errors"],
    ["1", "Errors found"],
    ["2", "A file could not be read"],
    ["3", "Rule packs not installed"],
    ["4", "Incomplete check: a rule set could not run"],
]
links_title = "Links"
quick_title = "Quick start"
quick_hint = "Python 3.10+"
quick_code = """uvx lintvoice rules install      # once: downloads the pinned rule packs
uvx lintvoice check invoice.pdf
uvx lintvoice check invoices/ --format json"""
quick_note = "Or pip install lintvoice. The rule packs are downloaded once from their official sources, pinned to an exact version (a SHA-256 hash or a git commit); after that, every check runs offline."
output_title = "What a report looks like"
output_hint = "lintvoice check facture.pdf"
output_note = "Findings are grouped by rule. BR-FR messages are the official French text, published by FNFE-MPE."
rules_title = "Rules it runs"
rules_head = ["Rule set", "Version", "Published by", "Applied to"]
rules_rows = [
    ["EN 16931", "1.3.17", "CEN, via ConnectingEurope", "every CII and UBL invoice"],
    ["Factur-X profile rules", "1.09.2", "FNFE-MPE", "Factur-X PDFs (BASIC WL, EN 16931, EXTENDED)"],
    ["BR-FR", "1.4.0.04", "FNFE-MPE (France_RFE)", "invoices whose seller is in France"],
    ["XML schemas", "CII D22B, Factur-X 1.09.2, UBL 2.1", "UN/CEFACT, FNFE-MPE, OASIS", "every invoice"],
]
not_checked_title = "Not checked yet"
not_checked = [
    "PDF/A-3 validation of Factur-X PDFs.",
    "XRechnung and Peppol BIS rules: those invoices get EN 16931 only, and the report says so.",
    "Factur-X MINIMUM and BASIC profile rules: France_RFE 1.4.0.04 does not ship them.",
]
examples_title = "Example invoices"
examples_text = "92 French Factur-X invoices: one valid, and 91 invalid variants that each fail a named rule. Each one is checked against the official rules. Public domain ([CC0 1.0](https://creativecommons.org/publicdomain/zero/1.0/))."
examples_link = "Browse the examples"

[examples]
title = "Example e-invoices, valid and invalid (Factur-X, CII)"
description = "92 French Factur-X EN 16931 invoices to test your tools: one valid, and 91 invalid variants that each fail a named EN 16931 or BR-FR rule. XML and PDF, public domain."
h1 = "Example e-invoices, valid and invalid"
brief = "92 French Factur-X invoices, EN 16931 profile: one valid, and 91 invalid variants that each fail a named rule. Use them to test an invoicing tool or a validator."
