[about]
title = "About lintvoice"
description = "Why lintvoice exists, what it does, what is open, and who publishes it."
h1 = "About lintvoice"
brief = "lintvoice explains the official e-invoicing rules in plain words, so anyone can fix their invoice."
why_head = "Why lintvoice exists"
why = [
    "E-invoicing between businesses is becoming mandatory, in France as in Germany. In France, invoices go through approved platforms that check them against official rules. An invoice that fails one of them can be rejected with a code like BR-FR-10. For the person who sent it, that code says neither what is wrong nor how to fix it.",
    "lintvoice explains the rules in plain words, starting with the French ones, shows them on an example invoice and says how to fix the error. You can check your invoice before sending it, in your browser. Developers who produce these invoices run the same rules offline, in their continuous integration, and test their software with the same example invoices.",
    "lintvoice starts with France and the European standard. Germany and the Peppol network (Belgium, then the United Kingdom) come next.",
]
open_head = "Open and verifiable"
open = [
    "The code is public on [GitHub](https://github.com/lintvoice), under the MIT licence.",
    "The rule texts are under CC BY-SA 4.0, and the example invoices in the public domain (CC0).",
    "Every page cites the official rules with their source and version.",
    "The invoice you check on this site never leaves your computer.",
    "We run the official rules; we do not promise the result.",
]
who_head = "Who makes lintvoice"
who = [
    "[To come: the name of the person who makes lintvoice, and one sentence on why.]",
]
legal_line = "lintvoice is published by AllGood Services SAS, a French company. Its details are in the"
legal_link = "legal notice"
contact_line = "A question, a comment, an idea? Write to"
contact_after = "We'll be glad to hear from you."

