ideas_sub = "“I'm interested” opens an email with the idea as its subject."

[[pricing.blocks.items]]
what = "Being told when the rules change"
why = "The European rules have changed [twice a year since 2024](https://github.com/ConnectingEurope/eInvoicing-EN16931/releases); the French ones went through [five versions in two months in 2026](https://github.com/fnfempe/France_RFE/releases). We would run your test invoices against each new version, and tell you what no longer passes, and why."
ask = "Interest: rule change alerts"

[[pricing.blocks.items]]
what = "Checking with nothing to install, through an API"
why = "For software that cannot run the command-line tool, and invoices of more than {max_lines} lines, too long for the browser. Your invoices would go through our servers, with a written commitment on what we do with them."
ask = "Interest: checking API"

[[pricing.blocks.items]]
what = "A workspace for accounting firms"
why = "All your clients' invoices at once, one report per client, and checks beyond the official rules: does this company ID, this VAT number exist? They query public registers, so they can't run in your browser alone."
ask = "Interest: accounting firm workspace"

