[check]
title = "Online e-invoice validator: check a Factur-X, UBL or CII invoice"
description = "Check a Factur-X, UBL or CII invoice against the official EN 16931 and BR-FR rules, understand each error and fix it. Free, no account. The check runs in your browser, so the invoice is not sent anywhere."
h1 = "Check an e-invoice"
brief = "Drop your invoice to check it against the official rules. For each error, you see what is wrong in your invoice and how to fix it."
