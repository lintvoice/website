[home]
title = "lintvoice : vérifier ses factures électroniques avec les règles officielles, hors ligne"
description = "Validateur open source pour les factures électroniques CII, UBL et Factur-X. Il applique les règles officielles EN 16931, Factur-X et BR-FR, hors ligne."
h1 = "Vérifiez vos factures électroniques avec les règles officielles, hors ligne"
brief = "lintvoice est un validateur open source en ligne de commande pour les factures CII, UBL et Factur-X. Il applique les règles officielles EN 16931, Factur-X et françaises BR-FR hors ligne : vos factures ne sont envoyées nulle part."
glance_title = "En bref"
glance = [
    ["Licence", "[MIT](https://github.com/lintvoice/lintvoice/blob/main/LICENSE)"],
    ["Python", "3.10 ou plus"],
    ["Lit", "CII, UBL, PDF Factur-X et ZUGFeRD"],
    ["Réseau", "seulement pour installer les règles, une fois"],
]
exit_title = "Codes de sortie"
exit_codes = [
    ["0", "Aucune erreur"],
    ["1", "Erreurs trouvées"],
    ["2", "Un fichier n'a pas pu être lu"],
    ["3", "Jeux de règles non installés"],
    ["4", "Vérification incomplète : un jeu de règles n'a pas pu s'exécuter"],
]
links_title = "Liens"
quick_title = "Démarrer"
quick_hint = "Python 3.10+"
quick_code = """uvx lintvoice rules install      # une fois : télécharge les jeux de règles figés
uvx lintvoice check facture.pdf
uvx lintvoice check factures/ --format json"""
quick_note = "Ou pip install lintvoice. Les jeux de règles sont téléchargés une seule fois depuis leurs sources officielles, figés à une version exacte (une empreinte SHA-256 ou un commit git) ; ensuite, chaque vérification se fait hors ligne."
output_title = "À quoi ressemble un rapport"
output_hint = "lintvoice check facture.pdf"
output_note = "Les constats sont regroupés par règle. Les messages BR-FR sont le texte officiel publié par le FNFE-MPE ; lintvoice affiche le reste en anglais."
