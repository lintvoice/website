[about]
title = "À propos de lintvoice"
description = "Pourquoi lintvoice existe, ce qu'il fait, ce qui est ouvert, et qui l'édite."
h1 = "Les règles de la facture électronique, en clair."
brief = "Pour corriger une facture vous-même, ou la vérifier dans votre logiciel avant qu'elle ne parte."
# The page's picture: lintvoice's file card, a label and its value on each row.
card_label = "Fiche"
card_rows = [
    ["Vérifie", "les factures, selon les règles officielles"],
    ["Explique", "les erreurs, sur des factures d'exemple"],
    ["Commence par", "la norme européenne et la France"],
    ["Ensuite", "l'Allemagne, puis le réseau Peppol"],
    ["Code", "public, licence MIT"],
    ["Pages de règles", "CC BY-SA 4.0"],
    ["Factures d'exemple", "domaine public (CC0)"],
    ["Édité par", "AllGood Services SAS, en France"],
]
card_caption = "lintvoice en une fiche."
# Beside the why: the code a platform returns, then the rule page that explains it.
code_label = "Le code que vous recevez"
page_label = "La page qui l'explique"
page_caption = "La page de la règle, telle qu'elle est en ligne."
why_head = "Pourquoi lintvoice existe"
why = [
    "La facture électronique devient obligatoire entre entreprises, en France comme en Allemagne. En France, les factures passent par des plateformes agréées qui les vérifient selon des règles officielles. Une facture qui échoue à l'une d'elles peut être rejetée avec un code comme BR-FR-10. Pour la personne qui facture, ce code ne dit pas ce qui ne va pas, ni comment le corriger.",
    "lintvoice explique les règles en mots simples, en commençant par les règles françaises, les montre sur une facture d'exemple et dit comment corriger. Vous pouvez vérifier votre facture avant de l'envoyer, dans votre navigateur. Les développeurs qui produisent ces factures appliquent les mêmes règles hors ligne, dans leur intégration continue, et testent leurs logiciels avec les mêmes factures d'exemple.",
    "lintvoice commence par la norme européenne et la France. L'Allemagne et le réseau Peppol (la Belgique, puis le Royaume-Uni) sont les prochaines étapes.",
]
open_head = "Ouvert et vérifiable"
open = [
    "Le code est public sur [GitHub](https://github.com/lintvoice), sous licence MIT.",
    "Les textes des règles sont sous licence CC BY-SA 4.0, et les factures d'exemple dans le domaine public (CC0).",
    "Chaque page cite les règles officielles avec leur source et leur version.",
    "La facture que vous vérifiez sur ce site ne quitte pas votre ordinateur.",
    "Nous appliquons les règles officielles ; nous ne promettons pas le résultat.",
]
who_head = "Qui fait lintvoice"
who = [
    "Nous faisons lintvoice au bord du lac d'Annecy. Il est né d'une frustration : comprendre la facture électronique dans le détail était bien trop difficile, et les outils existants n'y aidaient pas.",
]
legal_line = "lintvoice est édité par AllGood Services SAS, une société française. Ses coordonnées sont dans les"
legal_link = "mentions légales"
contact_line = "Une question, une remarque, une idée ? Écrivez-nous à"
contact_after = "Nous serons heureux d'échanger avec vous."

