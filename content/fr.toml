[[pricing.blocks]]
key = "verifier"
head = "Vérifier ne coûte rien."
text = [
    "Votre facture est vérifiée dans votre navigateur, ou dans votre terminal avec l'outil en ligne de commande. Elle ne passe jamais par nos serveurs, donc la vérifier ne nous coûte rien, et ne vous coûte rien.",
    "Le code de la page de vérification est public : [lisez-le sur GitHub](https://github.com/lintvoice/website).",
]

[[pricing.blocks]]
key = "publie"
head = "Ce que nous publions, vous pouvez le garder."
text = [
    "Une fois qu'une page de règle, une facture d'exemple ou une version de lintvoice est publiée, vous pouvez la reprendre et l'adapter, même si nous changeons d'avis un jour. Leurs licences le permettent : CC BY-SA 4.0 pour les textes des règles, domaine public (CC0) pour les factures d'exemple, [licence MIT](https://github.com/lintvoice/lintvoice/blob/main/LICENSE) pour le code.",
]

[[pricing.blocks]]
key = "payant"
head = "Seul ce qui tourne sur nos serveurs pourrait devenir payant."
sub = "Un tel service, hébergé en Europe, nous coûte à faire fonctionner. Aucun n'existe encore."
ideas_head = "Trois services possibles. Lequel vous servirait ?"
ideas_sub = "« Ça m'intéresse » ouvre un e-mail avec l'idée en objet."

[[pricing.blocks.items]]
what = "Être prévenu quand les règles changent"
why = "Les règles européennes changent [deux fois par an depuis 2024](https://github.com/ConnectingEurope/eInvoicing-EN16931/releases) ; les françaises ont connu [cinq versions en deux mois en 2026](https://github.com/fnfempe/France_RFE/releases). Nous passerions vos factures de test sur chaque nouvelle version, et vous dirions ce qui ne passe plus, et pourquoi."
ask = "Intérêt : alertes de changement de règles"

[[pricing.blocks.items]]
what = "Vérifier sans rien installer, par une API"
why = "Pour les logiciels qui ne peuvent pas lancer l'outil en ligne de commande, et les factures de plus de {max_lines} lignes, trop longues pour le navigateur. Vos factures passeraient par nos serveurs, avec un engagement écrit sur ce que nous en faisons."
ask = "Intérêt : API de vérification"

[[pricing.blocks.items]]
what = "Un espace pour les cabinets comptables"
why = "Les factures de tous vos clients en une fois, un rapport par client, et des vérifications au-delà des règles officielles : ce SIREN, ce numéro de TVA existent-ils ? Elles interrogent des registres publics, donc pas depuis votre seul navigateur."
ask = "Intérêt : espace cabinet comptable"

[[pricing.blocks]]
key = "pas-encore"
head = "Ce que lintvoice ne fait pas encore"
sub = "Mieux vaut le savoir avant."

[[pricing.blocks.items]]
what = "Une page pour chaque règle"
why = "{explained} règles expliquées sur {total} aujourd'hui, en commençant par les règles françaises. Les autres sont vérifiées, avec leur message officiel."

[[pricing.blocks.items]]
what = "Les règles allemandes (XRechnung) et celles du réseau Peppol"
why = "Ces factures sont vérifiées selon la norme européenne seule, et le rapport le dit. L'Allemagne est notre prochaine étape."

[[pricing.blocks.items]]
what = "Le format d'archivage du PDF (PDF/A-3)"
why = "lintvoice vérifie les données de la facture, pas encore le format du PDF qui les contient."

[[pricing.blocks.items]]
what = "Les factures de plus de {max_lines} lignes, dans le navigateur"
why = "Au-delà, la vérification serait trop lente dans une page web. L'outil en ligne de commande n'a pas cette limite."

[[pricing.blocks.items]]
what = "Savoir si un SIREN existe, ou si votre client recevra la facture"
why = "Les règles officielles vérifient la forme des données, pas leur réalité. Seule la plateforme de votre client sait si la facture lui parvient."

