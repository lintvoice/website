uvx lintvoice check facture.pdf
uvx lintvoice check factures/ --format json"""
quick_note = "Ou pip install lintvoice. Les jeux de règles sont téléchargés une seule fois depuis leurs sources officielles, figés à une version exacte (une empreinte SHA-256 ou un commit git) ; ensuite, chaque vérification se fait hors ligne."
output_title = "À quoi ressemble un rapport"
output_hint = "lintvoice check facture.pdf"
output_note = "Les constats sont regroupés par règle. Les messages BR-FR sont le texte officiel publié par le FNFE-MPE ; lintvoice affiche le reste en anglais."
